name: FlowSense Android Appium E2E Tests & Excel Report

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-e2e-tests:
    name: Build Android APK & Run 300 Appium E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'android/package.json'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install Android E2E Dependencies
        run: |
          cd android
          npm install

      - name: Run 300 Appium E2E Test Cases
        run: |
          cd android
          npm test

      - name: Upload Android Excel Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlowSense-Android-Appium-Excel-Report
          path: android/test-reports/android-e2e-report.xlsx
          if-no-files-found: warn

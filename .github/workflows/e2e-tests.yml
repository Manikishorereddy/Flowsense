name: FlowSense E2E Selenium Tests & Excel Report

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    name: Run Selenium E2E Tests & Generate Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Selenium E2E Tests
        run: |
          cd frontend
          npm test

      - name: Upload Excel Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlowSense-E2E-Excel-Report
          path: frontend/test-reports/e2e-test-report.xlsx
          if-no-files-found: warn
